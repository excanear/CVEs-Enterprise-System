# ─────────────────────────────────────────────────────────────────────────────
#  Dependency Review — blocks PRs that introduce HIGH/CRITICAL vulnerabilities
# ─────────────────────────────────────────────────────────────────────────────
name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1, LGPL-3.0
          comment-summary-in-pr: always
          warn-on-openssf-scorecard-level: 5
          # Allow known false-positives / dev-only packages
          allow-dependencies-licenses: |
            pkg:pypi/pytest
            pkg:pypi/pytest-asyncio
            pkg:pypi/pytest-cov
            pkg:pypi/ruff
            pkg:pypi/mypy
            pkg:pypi/bandit
            pkg:pypi/locust
