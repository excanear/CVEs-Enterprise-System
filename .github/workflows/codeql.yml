# ─────────────────────────────────────────────────────────────────────────────
#  CodeQL — SAST via GitHub Advanced Security
# ─────────────────────────────────────────────────────────────────────────────
name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Mondays at 09:00 UTC
    - cron: "0 9 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
          config: |
            paths-ignore:
              - "tests/**"
              - "**/migrations/**"
              - "**/alembic/**"
              - "**/*.min.js"
              - "**/node_modules/**"

      - name: Set up Python (for Python analysis)
        if: matrix.language == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv + workspace (Python analysis build step)
        if: matrix.language == 'python'
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.14"

      - name: Install Python workspace
        if: matrix.language == 'python'
        run: uv sync --all-extras

      - name: Set up Node (for JS/TS analysis)
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/dashboard/package-lock.json

      - name: Install Node deps (dashboard)
        if: matrix.language == 'javascript-typescript'
        working-directory: services/dashboard
        run: npm ci --prefer-offline

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          upload: true
