# ─────────────────────────────────────────────────────────────────────────────
#  Build · Push · Scan · SBOM · Sign
#  Triggers: CI passes on main, or release tag v*.*.*
# ─────────────────────────────────────────────────────────────────────────────
name: Build

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read
  packages: write          # push to GHCR
  security-events: write   # upload SARIF
  id-token: write          # cosign keyless signing (OIDC)
  attestations: write      # attest SBOM

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_ORG: ${{ github.repository_owner }}

# ─────────────────────────────────────────────────────────────────────────────
jobs:

# Only proceed if the triggering CI workflow succeeded.
  guard:
    name: Guard — CI must have passed
    runs-on: ubuntu-24.04
    if: |
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      should_build: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        run: echo "ok=true" >> "$GITHUB_OUTPUT"

# ── Filesystem vulnerability scan (before building images) ───────────────────
  fs-scan:
    name: Filesystem Scan (Trivy)
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Trivy — filesystem scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"   # warn only at this stage

      - name: Upload FS scan SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

# ── Matrix: build + push + scan + SBOM + sign each service ───────────────────
  build-service:
    name: Build · ${{ matrix.service }}
    needs: [guard, fs-scan]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: scan-orchestrator
            context: .
            dockerfile: services/scan-orchestrator/Dockerfile
            port: 8000
          - service: discovery-engine
            context: .
            dockerfile: services/discovery-engine/Dockerfile
            port: 8005
          - service: runtime-analysis-engine
            context: .
            dockerfile: services/runtime-analysis-engine/Dockerfile
            port: 8006
          - service: js-intelligence-engine
            context: .
            dockerfile: services/js-intelligence-engine/Dockerfile
            port: 8007
          - service: exposure-validation-engine
            context: .
            dockerfile: services/exposure-validation-engine/Dockerfile
            port: 8009
          - service: asset-graph-engine
            context: .
            dockerfile: services/asset-graph-engine/Dockerfile
            port: 8001
          - service: ai-correlation-layer
            context: .
            dockerfile: services/ai-correlation-layer/Dockerfile
            port: 8008
          - service: reporting-engine
            context: .
            dockerfile: services/reporting-engine/Dockerfile
            port: 8004
          - service: dashboard
            context: services/dashboard
            dockerfile: services/dashboard/Dockerfile
            port: 3000

    outputs:
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v6

      # ── Determine image tag ──────────────────────────────────────────────
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/cves-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=cves-${{ matrix.service }}
            org.opencontainers.image.description=CVEs Enterprise System — ${{ matrix.service }}
            org.opencontainers.image.vendor=CVEs Enterprise
            org.opencontainers.image.licenses=UNLICENSED

      # ── Docker Buildx setup ──────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build & Push ─────────────────────────────────────────────────────
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=${{ matrix.service }}
          cache-to: |
            type=gha,scope=${{ matrix.service }},mode=max
          provenance: true
          sbom: true   # BuildKit inline SBOM

      # ── Container Scan (Trivy) ───────────────────────────────────────────
      - name: Trivy — image vulnerability scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: >-
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/cves-${{ matrix.service }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"    # block on HIGH/CRITICAL by default
          ignore-unfixed: true

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      # ── SBOM Generation (Syft → SPDX + CycloneDX) ───────────────────────
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.17.0

      - name: Generate SBOM (SPDX JSON)
        run: |
          syft \
            "${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/cves-${{ matrix.service }}@${{ steps.push.outputs.digest }}" \
            --output spdx-json=sbom-${{ matrix.service }}-spdx.json \
            --output cyclonedx-json=sbom-${{ matrix.service }}-cyclonedx.json

      - name: Upload SBOMs as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.service }}
          path: |
            sbom-${{ matrix.service }}-spdx.json
            sbom-${{ matrix.service }}-cyclonedx.json
          retention-days: 90

      # ── Cosign keyless signing ───────────────────────────────────────────
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign image (keyless / OIDC)
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/cves-${{ matrix.service }}@${{ steps.push.outputs.digest }}"

      - name: Attest SBOM (SPDX)
        run: |
          cosign attest --yes \
            --predicate sbom-${{ matrix.service }}-spdx.json \
            --type spdxjson \
            "${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/cves-${{ matrix.service }}@${{ steps.push.outputs.digest }}"

      # ── Dockle lint (Dockerfile best-practices) ──────────────────────────
      - name: Dockle — Dockerfile linting
        uses: goodwithtech/dockle-action@v0.1.2
        with:
          image: >-
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/cves-${{ matrix.service }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: dockle-${{ matrix.service }}.sarif
          exit-code: "1"
          ignore: "CIS-DI-0010"   # accept non-root user pattern used

      - name: Upload Dockle SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: dockle-${{ matrix.service }}.sarif
          category: dockle-${{ matrix.service }}

  # ── Aggregate digest manifest ───────────────────────────────────────────────
  manifest:
    name: Publish Digest Manifest
    needs: build-service
    runs-on: ubuntu-24.04
    steps:
      - name: Write digest summary
        run: |
          echo "## Built Images" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | Digest |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "All service images built, scanned, SBOMed and signed." >> "$GITHUB_STEP_SUMMARY"
