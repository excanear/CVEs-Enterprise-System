# ── Reporting Engine — Deployment ─────────────────────────────────────────────
# Kafka consumer (acl.correlation.events). KEDA scales on consumer lag (min=1 max=5).
# Generates structured reports + writes to PostgreSQL + OpenSearch.
# Port 8009.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-engine
  namespace: cves-backend
  labels:
    app.kubernetes.io/name: reporting-engine
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: cves-platform
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: reporting-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reporting-engine
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: cves-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8009"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: reporting-engine
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        nodegroup: general
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: reporting-engine
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
      containers:
        - name: reporting-engine
          image: ghcr.io/cves-enterprise/reporting-engine:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8009
              name: http
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cves-platform-secrets
                  key: database-url
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "cves-kafka-kafka-bootstrap.cves-infra.svc.cluster.local:9092"
            - name: OPENSEARCH_URL
              value: "http://opensearch.cves-infra.svc.cluster.local:9200"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.cves-backend.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "reporting-engine"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PORT
              value: "8009"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: reporting-engine
  namespace: cves-backend
  labels:
    app.kubernetes.io/name: reporting-engine
    app.kubernetes.io/part-of: cves-platform
spec:
  selector:
    app.kubernetes.io/name: reporting-engine
  ports:
    - port: 8009
      targetPort: http
      name: http
  type: ClusterIP

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: reporting-engine
  namespace: cves-backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: reporting-engine
