# ── Exposure Validation Engine — Deployment ───────────────────────────────────
# Playwright on-demand (single-use browser instances per validation job).
# KEDA scales via jsi.js.events consumer lag (group: exposure-validation-engine).
# Same browser-pool node requirements as RAE but 1Gi /dev/shm (on-demand vs pool).
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exposure-validation-engine
  namespace: cves-scanner
  labels:
    app.kubernetes.io/name: exposure-validation-engine
    app.kubernetes.io/component: scanner
    app.kubernetes.io/part-of: cves-platform
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: exposure-validation-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: exposure-validation-engine
        app.kubernetes.io/component: scanner
        app.kubernetes.io/part-of: cves-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8006"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: exposure-validation-engine
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        nodegroup: browser
      tolerations:
        - key: browser
          operator: Equal
          value: "true"
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: exposure-validation-engine
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 60
      containers:
        - name: exposure-validation-engine
          image: ghcr.io/cves-enterprise/exposure-validation-engine:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8006
              name: http
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cves-platform-secrets
                  key: database-url
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "cves-kafka-kafka-bootstrap.cves-infra.svc.cluster.local:9092"
            - name: REDIS_URL
              # Sentinel format: redis-py auto-discovers master via sentinel protocol
              value: "redis+sentinel://cves-redis.cves-infra.svc.cluster.local:26379/mymaster/0"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.cves-backend.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "exposure-validation-engine"
            - name: HTTP_PROXY
              value: "http://squid.cves-scanner.svc.cluster.local:3128"
            - name: HTTPS_PROXY
              value: "http://squid.cves-scanner.svc.cluster.local:3128"
            - name: NO_PROXY
              value: ".svc.cluster.local,localhost,127.0.0.1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PORT
              value: "8006"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/cves
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 4
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 6Gi
          securityContext:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: exposure-validation-engine
  namespace: cves-scanner
  labels:
    app.kubernetes.io/name: exposure-validation-engine
    app.kubernetes.io/part-of: cves-platform
spec:
  selector:
    app.kubernetes.io/name: exposure-validation-engine
  ports:
    - port: 8006
      targetPort: http
      name: http
  type: ClusterIP

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: exposure-validation-engine
  namespace: cves-scanner
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: exposure-validation-engine
