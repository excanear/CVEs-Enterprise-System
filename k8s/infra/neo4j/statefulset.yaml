# ── Neo4j Community — StatefulSet ─────────────────────────────────────────────
# Community edition: single node (no native clustering).
# HA via K8s StatefulSet restart (RTO ~30s on pod failure).
# Upgrade path: Replace with neo4j/neo4j Helm chart + Enterprise license
#               to enable causal clustering (1 core + 2 read replicas).
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: neo4j-config
  namespace: cves-infra
  labels:
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/part-of: cves-platform
data:
  neo4j.conf: |
    # Network
    server.bolt.listen_address=0.0.0.0:7687
    server.http.listen_address=0.0.0.0:7474
    server.default_listen_address=0.0.0.0

    # Memory
    server.memory.heap.initial_size=1g
    server.memory.heap.max_size=2g
    server.memory.pagecache.size=1g

    # Plugins (APOC loaded via initContainer)
    dbms.security.procedures.unrestricted=apoc.*
    dbms.security.procedures.allowlist=apoc.*

    # Logging
    server.logs.debug.enabled=false

    # Security
    dbms.security.auth_enabled=true

---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: cves-infra
  labels:
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/part-of: cves-platform
spec:
  selector:
    app.kubernetes.io/name: neo4j
  ports:
    - port: 7687
      targetPort: bolt
      name: bolt
    - port: 7474
      targetPort: http
      name: http
  type: ClusterIP
  clusterIP: None   # Headless for StatefulSet DNS

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: cves-infra
  labels:
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/component: graph-database
    app.kubernetes.io/part-of: cves-platform
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: neo4j
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neo4j
        app.kubernetes.io/component: graph-database
        app.kubernetes.io/part-of: cves-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2004"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 7474
        runAsGroup: 7474
        fsGroup: 7474
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: infra
          operator: Equal
          value: "true"
          effect: NoSchedule
      nodeSelector:
        nodegroup: infra
      terminationGracePeriodSeconds: 60
      initContainers:
        # Download APOC plugin if not present
        - name: install-apoc
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - |
              APOC_VERSION="5.24.0"
              DEST="/plugins/apoc-${APOC_VERSION}-core.jar"
              if [ ! -f "$DEST" ]; then
                curl -fsSL \
                  "https://github.com/neo4j-contrib/neo4j-apoc-procedures/releases/download/${APOC_VERSION}/apoc-${APOC_VERSION}-core.jar" \
                  -o "$DEST"
              fi
          volumeMounts:
            - name: plugins
              mountPath: /plugins
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      containers:
        - name: neo4j
          image: neo4j:5.24-community
          ports:
            - containerPort: 7687
              name: bolt
            - containerPort: 7474
              name: http
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_AUTH
            - name: NEO4J_PLUGINS
              value: '[]'  # Loaded via initContainer
            - name: NEO4J_server_memory_heap_initial__size
              value: "1g"
            - name: NEO4J_server_memory_heap_max__size
              value: "2g"
            - name: NEO4J_server_memory_pagecache_size
              value: "1g"
            - name: NEO4J_dbms_security_procedures_unrestricted
              value: "apoc.*"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: plugins
              mountPath: /plugins
            - name: logs
              mountPath: /logs
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              cpu: "4"
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: plugins
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: gp3
        resources:
          requests:
            storage: 50Gi
