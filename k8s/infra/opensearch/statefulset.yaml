# ── OpenSearch — StatefulSet ──────────────────────────────────────────────────
# Single-node (discovery.type=single-node) — scale to 3-node cluster by
# setting replicas=3 and removing discovery.type override (requires Enterprise
# or OSS cluster config). Security plugin disabled for internal-only access.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-config
  namespace: cves-infra
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/part-of: cves-platform
data:
  opensearch.yml: |
    cluster.name: cves-opensearch
    network.host: 0.0.0.0
    discovery.type: single-node
    plugins.security.disabled: true
    # Performance
    indices.memory.index_buffer_size: 20%
    thread_pool.write.queue_size: 500

---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: cves-infra
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/part-of: cves-platform
spec:
  selector:
    app.kubernetes.io/name: opensearch
  ports:
    - port: 9200
      targetPort: http
      name: http
    - port: 9600
      targetPort: metrics
      name: metrics
  type: ClusterIP

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  namespace: cves-infra
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/component: search
    app.kubernetes.io/part-of: cves-platform
spec:
  serviceName: opensearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch
        app.kubernetes.io/component: search
        app.kubernetes.io/part-of: cves-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9600"
        prometheus.io/path: "/_prometheus/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # Required for vm.max_map_count sysctl
        sysctls:
          - name: vm.max_map_count
            value: "262144"
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: infra
          operator: Equal
          value: "true"
          effect: NoSchedule
      nodeSelector:
        nodegroup: infra
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: fix-permissions
          image: busybox:1.37
          command: [sh, -c, "chown -R 1000:1000 /usr/share/opensearch/data"]
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.17.0
          ports:
            - containerPort: 9200
              name: http
            - containerPort: 9600
              name: metrics
          env:
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms1g -Xmx1g"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
            - name: config
              mountPath: /usr/share/opensearch/config/opensearch.yml
              subPath: opensearch.yml
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=5s
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          # memlock ulimits (equivalent to docker ulimits memlock soft/hard: -1)
          # Set via securityContext.sysctls above (vm.max_map_count)
      volumes:
        - name: config
          configMap:
            name: opensearch-config
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: gp3
        resources:
          requests:
            storage: 200Gi
