# ── ServiceAccounts — one per service, automountServiceAccountToken: false ────
# Each service gets its own SA with the minimum possible permissions.
# Operators (Strimzi, CloudNativePG, KEDA) manage their own SAs.
# ──────────────────────────────────────────────────────────────────────────────

