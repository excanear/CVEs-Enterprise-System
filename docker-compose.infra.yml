version: "3.9"

# Local dev infrastructure for the CVEs Enterprise Platform.
# Start: docker compose -f docker-compose.infra.yml up -d
# Stop:  docker compose -f docker-compose.infra.yml down

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cves
      POSTGRES_PASSWORD: cves_secret
      POSTGRES_DB: cves_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cves"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Zookeeper (required by Kafka) ──────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # ── Kafka ──────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9101:9101"  # JMX
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Confluent Schema Registry ─────────────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "kafka:29092"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"

  # ── Redis ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Neo4j ─────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.24-community
    restart: unless-stopped
    ports:
      - "7474:7474"  # Browser
      - "7687:7687"  # Bolt
    environment:
      NEO4J_AUTH: neo4j/neo4j_secret
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data

  # ── OpenSearch ────────────────────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.17.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - plugins.security.disabled=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── OTel Collector ────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    restart: unless-stopped
    ports:
      - "4317:4317"   # gRPC
      - "4318:4318"   # HTTP
      - "8888:8888"   # Prometheus metrics
    volumes:
      - ./infra/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro

  # ── Jaeger ────────────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.62
    restart: unless-stopped
    ports:
      - "16686:16686"  # UI
      - "14250:14250"  # gRPC from OTel collector

  # ── Runtime Analysis Engine ───────────────────────────────────────────
  runtime-analysis-engine:
    build:
      context: .
      dockerfile: services/runtime-analysis-engine/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8004:8004"
    environment:
      DATABASE_URL: "postgresql+asyncpg://cves:cves_secret@postgres:5432/cves_platform"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      BROWSER_POOL_SIZE: "3"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    shm_size: "2gb"   # Chromium needs shared memory

  # ── JS Intelligence Engine ────────────────────────────────────────────
  js-intelligence-engine:
    build:
      context: .
      dockerfile: services/js-intelligence-engine/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8005:8005"
    environment:
      DATABASE_URL: "postgresql+asyncpg://cves:cves_secret@postgres:5432/cves_platform"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"

  # ── Exposure Validation Engine ────────────────────────────────────────
  exposure-validation-engine:
    build:
      context: .
      dockerfile: services/exposure-validation-engine/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8006:8006"
    environment:
      DATABASE_URL: "postgresql+asyncpg://cves:cves_secret@postgres:5432/cves_platform"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      REDIS_URL: "redis://redis:6379/0"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    shm_size: "1gb"   # Playwright on-demand needs shared memory

  # ── Asset Graph Engine ────────────────────────────────────────────────
  asset-graph-engine:
    build:
      context: .
      dockerfile: services/asset-graph-engine/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_started
    ports:
      - "8007:8007"
    environment:
      DATABASE_URL: "postgresql+asyncpg://cves:cves_secret@postgres:5432/cves_platform"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      NEO4J_URL: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "neo4j_secret"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"

  # ── AI Correlation Layer ──────────────────────────────────────────────
  ai-correlation-layer:
    build:
      context: .
      dockerfile: services/ai-correlation-layer/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8008:8008"
    environment:
      DATABASE_URL: "postgresql+asyncpg://cves:cves_secret@postgres:5432/cves_platform"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      REDIS_URL: "redis://redis:6379/1"
      LLM_ENABLED: "false"
      LLM_API_KEY: ""
      LLM_BASE_URL: ""
      LLM_MODEL: "gpt-4o-mini"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"

  # ── Reporting Engine ──────────────────────────────────────────────────
  reporting-engine:
    build:
      context: .
      dockerfile: services/reporting-engine/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8009:8009"
    environment:
      DATABASE_URL: "postgresql+asyncpg://cves:cves_secret@postgres:5432/cves_platform"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    restart: unless-stopped
    depends_on:
      - reporting-engine
    ports:
      - "3000:3000"
    environment:
      RAE_BASE_URL: "http://runtime-analysis-engine:8004"
      JSI_BASE_URL: "http://js-intelligence-engine:8005"
      EVE_BASE_URL: "http://exposure-validation-engine:8006"
      AGE_BASE_URL: "http://asset-graph-engine:8007"
      ACL_BASE_URL: "http://ai-correlation-layer:8008"
      RE_BASE_URL: "http://reporting-engine:8009"
      SO_BASE_URL: "http://scan-orchestrator:8003"
      NEXT_PUBLIC_DEFAULT_TENANT_ID: "00000000-0000-0000-0000-000000000001"

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  opensearch_data:
