[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cves-enterprise-platform"
version = "0.1.0"
requires-python = ">=3.12"
readme = "README.md"
description = "Enterprise Attack Surface Intelligence & Exposure Validation Platform"

# Workspace members are referenced here for uv workspace resolution.
# Install all libs in dev: uv pip install -e libs/db-base -e libs/event-schemas ...
[tool.uv.workspace]
members = [
    "libs/db-base",
    "libs/event-schemas",
    "libs/kafka-client",
    "libs/observability",
    "libs/rule-engine",
    "libs/security",
    "services/scan-orchestrator",
    "services/discovery-engine",
    "services/runtime-analysis-engine",
    "services/js-intelligence-engine",
    "services/exposure-validation-engine",
    "services/asset-graph-engine",
    "services/ai-correlation-layer",
    "services/reporting-engine",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "B", "UP", "SIM", "S", "BLE001"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "libs"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: pure domain logic, no I/O",
    "integration: real DB / Redis (requires docker-compose.infra.yml)",
    "async_svc: asyncio application service tests",
    "contract: Kafka event schema contracts",
    "event_driven: Kafka consumer/producer pipeline",
    "e2e: Playwright browser tests (requires running app)",
    "performance: Locust / load tests (run separately)",
]
filterwarnings = [
    "ignore::DeprecationWarning:confluent_kafka",
    "ignore::DeprecationWarning:asyncpg",
]

[tool.coverage.run]
source = ["services", "libs"]
omit = ["*/migrations/*", "*/alembic/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
]
