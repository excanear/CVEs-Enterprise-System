# Squid egress proxy — CVEs Enterprise Platform
# Used by scanner services (RAE, EVE, JSI, discovery) to filter outbound HTTP/HTTPS.
# Blocks connections to RFC1918, link-local, and cloud metadata endpoints at the
# network layer, providing defense-in-depth alongside app-level SSRF guards.

# ── ACLs ──────────────────────────────────────────────────────────────────────

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# Destination blocks: private / reserved IP space
acl to_private dst 10.0.0.0/8
acl to_private dst 172.16.0.0/12
acl to_private dst 192.168.0.0/16
acl to_private dst 127.0.0.0/8
acl to_private dst 169.254.0.0/16       # link-local / cloud IMDS
acl to_private dst 100.64.0.0/10        # carrier-grade NAT
acl to_private dst ::1/128
acl to_private dst fc00::/7
acl to_private dst fe80::/10

# Explicit metadata IPs (belt-and-suspenders)
acl to_metadata dst 169.254.169.254/32  # AWS/GCP/Azure IMDS
acl to_metadata dst 100.100.100.200/32  # Alibaba Cloud metadata

# Docker internal networks (scanner services must not pivot to backend/infra)
acl to_docker_internal dst 172.16.0.0/12

# ── Access rules (order matters) ──────────────────────────────────────────────

# Deny CONNECT to non-SSL ports (prevents HTTP CONNECT tunnelling to arbitrary ports)
http_access deny CONNECT !SSL_ports

# Deny access to non-standard ports
http_access deny !Safe_ports

# Deny all connections to private / metadata addresses
http_access deny to_private
http_access deny to_metadata
http_access deny to_docker_internal

# Allow everything else (internet targets)
http_access allow all

# ── Proxy settings ────────────────────────────────────────────────────────────

http_port 3128

# Use public resolvers — avoids relying on Docker's internal DNS for external lookups
dns_nameservers 8.8.8.8 8.8.4.4 1.1.1.1

# Disable caching (scanner traffic must always reach the live target)
cache deny all
cache_mem 8 MB

# ── Logging ───────────────────────────────────────────────────────────────────

access_log stdio:/dev/stdout combined
cache_log stdio:/dev/stderr
