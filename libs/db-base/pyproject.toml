[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cves-db-base"
version = "0.1.0"
description = "Shared DB base: AsyncSessionFactory, DeclarativeBase, OutboxMixin, RLSMiddleware, CursorPagination"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "testcontainers[postgres]>=4.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cves_db"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
