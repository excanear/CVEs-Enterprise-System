[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asset-graph-engine"
version = "0.1.0"
requires-python = ">=3.12"
description = "Asset Graph Engine — Neo4j-backed attack surface graph: attack paths, trust chains, exposure propagation, infra relationships"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "neo4j>=5.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "confluent-kafka>=2.6",
    "cves-db-base",
    "cves-event-schemas",
    "cves-kafka-client",
    "cves-observability",
    "cves-security",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asset_graph"]

[tool.uv.sources]
cves-db-base = { path = "../../libs/db-base", editable = true }
cves-event-schemas = { path = "../../libs/event-schemas", editable = true }
cves-kafka-client = { path = "../../libs/kafka-client", editable = true }
cves-observability = { path = "../../libs/observability", editable = true }
cves-security = { path = "../../libs/security", editable = true }
