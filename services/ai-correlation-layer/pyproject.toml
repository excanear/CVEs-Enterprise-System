[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-correlation-layer"
version = "0.1.0"
requires-python = ">=3.12"
description = "AI Correlation Layer — DBSCAN evidence clustering, deterministic attack path ranking, exposure prioritization, and template-based remediation generation"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "confluent-kafka>=2.6",
    "scikit-learn>=1.5",
    "numpy>=2.0",
    "redis[asyncio]>=5.2",
    "openai>=1.50",
    "cves-db-base",
    "cves-event-schemas",
    "cves-kafka-client",
    "cves-observability",
    "cves-security",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_correlation"]

[tool.uv.sources]
cves-db-base = { path = "../../libs/db-base", editable = true }
cves-event-schemas = { path = "../../libs/event-schemas", editable = true }
cves-kafka-client = { path = "../../libs/kafka-client", editable = true }
cves-observability = { path = "../../libs/observability", editable = true }
cves-security = { path = "../../libs/security", editable = true }
