[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runtime-analysis-engine"
version = "0.1.0"
requires-python = ">=3.12"
description = "Dynamic runtime analysis of web applications via headless browser instrumentation"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "playwright>=1.49",
    "httpx[http2]>=0.28",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "redis[asyncio]>=5.2",
    "pydantic-settings>=2.7",
    "cves-db-base",
    "cves-event-schemas",
    "cves-kafka-client",
    "cves-observability",
    "cves-security",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/runtime_analysis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
