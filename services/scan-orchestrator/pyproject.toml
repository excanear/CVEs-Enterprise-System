[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scan-orchestrator"
version = "0.1.0"
requires-python = ">=3.12"
description = "Enterprise distributed scan orchestration service"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "redis[asyncio]>=5.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-croniter>=3.0.0",
    "cves-db-base",
    "cves-event-schemas",
    "cves-kafka-client",
    "cves-observability",
    "cves-security",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scan_orchestrator"]
